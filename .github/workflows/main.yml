name: .NET Desktop

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]  # 标签推送时触发（如 v1.0.0）
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write  # 创建 Release 需要写权限

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]  # 只构建 Release 版本用于发布

    runs-on: windows-latest

    env:
      Solution_Name: RunMe.sln  # 替换为你的解决方案名称（通常是项目名.sln）
      Output_Path: ./bin/Release  # 编译输出路径（根据实际项目调整）

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore $env:Solution_Name

      - name: Build project
        run: msbuild $env:Solution_Name /p:Configuration=$env:Configuration /p:Platform="Any CPU" /p:TargetFrameworkVersion=v4.7.2
        env:
          Configuration: ${{ matrix.configuration }}

      # 上传构建产物作为临时 Artifact（可选，用于调试）
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RunMe-Build
          path: ${{ env.Output_Path }}/*.exe

      # 仅在推送标签时创建 Release 并附带 RunMe.exe
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create ${{ github.ref_name }} "${{ env.Output_Path }}/RunMe.exe" --title "Release ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}